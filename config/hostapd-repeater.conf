# Wireless access point settings.
# Change the SSID, passphrase, country code, and channel for your location.
interface=ap0
driver=nl80211
ssid=MyRepeater

# Uncomment and set this to your two-letter regulatory country code.
# country_code=US

hw_mode=g
channel=1
wmm_enabled=1

auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=REPLACE_WITH_A_UNIQUE_WIFI_PASSWORD
