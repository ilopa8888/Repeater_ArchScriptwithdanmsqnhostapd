# DHCP and DNS settings for the repeater AP interface.
# Keep this separate from the system-wide /etc/dnsmasq.conf.
interface=ap0
bind-interfaces

dhcp-authoritative
dhcp-range=192.168.12.20,192.168.12.200,255.255.255.0,12h
dhcp-option=option:router,192.168.12.1
dhcp-option=option:dns-server,192.168.12.1

domain-needed
bogus-priv
